[package]
name = "ampero"
version = "0.2.0"
edition = "2024"
default-run = "ampero"

[dependencies]
anyhow = "1.0.104"
eframe = { version = "0.36.2", optional = true }
image = { version = "0.25.10", default-features = false, features = ["png"], optional = true }
midir = "0.11.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order"] }
ureq = { version = "3.4.2", optional = true }
sha2 = { version = "0.11.1", optional = true }

[target.'cfg(windows)'.dependencies]
winreg = { version = "0.56.0", optional = true }

[build-dependencies]
winresource = "0.1.34"

[features]
gui = ["dep:eframe", "dep:image", "dep:sha2", "dep:ureq", "dep:winreg"]

[[bin]]
name = "ampero-gui"
path = "src/bin/ampero-gui/main.rs"
required-features = ["gui"]

[profile.release]
strip = true
