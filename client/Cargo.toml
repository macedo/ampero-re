[package]
name = "ampero"
version = "0.1.0"
edition = "2024"
default-run = "ampero"

[dependencies]
anyhow = "1.0.104"
eframe = { version = "0.36.2", optional = true }
image = { version = "0.25.10", default-features = false, features = ["png"], optional = true }
midir = "0.11.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
ureq = { version = "3.4.2", features = ["json"], optional = true }

[features]
gui = ["dep:eframe", "dep:image", "assistant"]
assistant = ["dep:ureq"]

[[bin]]
name = "ampero-gui"
path = "src/bin/ampero-gui/main.rs"
required-features = ["gui"]

[profile.release]
strip = true
