[package]
name = "ampero"
version = "0.1.0"
edition = "2024"
default-run = "ampero"

[dependencies]
anyhow = "1.0.104"
eframe = { version = "0.36.2", optional = true }
midir = "0.11.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"

[features]
gui = ["dep:eframe"]

[[bin]]
name = "ampero-gui"
path = "src/bin/ampero-gui/main.rs"
required-features = ["gui"]

[profile.release]
strip = true
